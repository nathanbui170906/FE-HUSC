<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Huế</title>
    <link rel="stylesheet" href="../css/site.css">
</head>
<body>
    <div class="container header">
        <ul class="header-menu">
            <li><a href="#">TRANG CHỦ</a></li>
            <li><a href="#">TOUR DU LỊCH HUẾ</a></li>
            <li><a href="#">LỄ HỘI</a></li>

            <li><a href="#">ĐIỂM THAM QUAN</a></li>
            <li><a href="#">ẨM THỰC HUẾ</a></li>
        </ul>
    </div>
    <div class="container content">
        <div class="content-box">
            <div class="box-1">
                <h1>Tour nổi bật</h1>
                <div class="box-1-pics">
                    <div class="tour-1">
                        <p>Du lịch Huế 2 ngày 1 đêm</p>
                        <img src="../images/tour_01.png" class="hue-tour">
                    </div>
                    <div class="tour-2">
                        <p>Sông nước Tam Giang</p>
                        <img src="../images/tour_02.png" class="water-tg">
                    </div>
                    <div class="tour-3">

                        <img src="../images/tour_04.png" class="dragon-boat">

                </div>

            <div class="box-2">

                <div class="box-2-pics">

    <div class="container footer">
        <img src="../images/bg_footer.png">
    </div>
